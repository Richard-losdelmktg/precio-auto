<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimador de Precio — Auto360</title>
<style>
  :root { --bg:#0f1420; --card:#1a2130; --line:#2b3446; --txt:#e6ebf5; --mut:#8b97ad;
          --acc:#4f8cff; --justo:#2ecc71; --bajo:#3aa0ff; --alto:#ff5c6c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:system-ui,Segoe UI,Roboto,sans-serif; padding:24px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:20px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input, select { width:100%; padding:10px 12px; background:#0f1420; color:var(--txt);
          border:1px solid var(--line); border-radius:9px; font-size:14px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { width:100%; margin-top:18px; padding:13px; background:var(--acc); color:#fff;
          border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  #out { display:none; }
  .rango { text-align:center; padding:8px 0 4px; }
  .rango .lbl { font-size:12px; color:var(--mut); }
  .barra { position:relative; height:8px; background:#0f1420; border-radius:6px; margin:14px 0 6px;
          border:1px solid var(--line); }
  .fill { position:absolute; top:0; bottom:0; background:linear-gradient(90deg,#3aa0ff,#4f8cff);
          border-radius:6px; opacity:.35; }
  .p50dot { position:absolute; top:-4px; width:2px; height:16px; background:#fff; }
  .ends { display:flex; justify-content:space-between; font-size:15px; font-weight:600; }
  .central { text-align:center; font-size:30px; font-weight:700; margin:6px 0; }
  .central small { display:block; font-size:12px; color:var(--mut); font-weight:400; }
  .estado { text-align:center; padding:12px; border-radius:10px; font-weight:700; margin-top:14px; font-size:16px; }
  .justo { background:rgba(46,204,113,.15); color:var(--justo); border:1px solid var(--justo); }
  .bajo  { background:rgba(58,160,255,.15); color:var(--bajo);  border:1px solid var(--bajo); }
  .alto  { background:rgba(255,92,108,.15); color:var(--alto);  border:1px solid var(--alto); }
  .foot { text-align:center; color:var(--mut); font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Estimador de Precio de Vehículo</h1>
  <div class="sub">Modelo LightGBM · {{met.n}} autos · error mediano {{met.mdape}}% · rango con {{met.cobertura}}% de cobertura</div>

  <div class="card">
    <div class="row">
      <div>
        <label>Marca</label>
        <select id="marca"></select>
      </div>
      <div>
        <label>Modelo</label>
        <select id="modelo"></select>
      </div>
    </div>
    <div class="row">
      <div><label>Año</label><input id="ano" type="number" value="2018" min="1990" max="2026"></div>
      <div><label>Kilometraje</label><input id="kilometraje" type="number" value="{{op.km_mediano}}"></div>
    </div>
    <div class="row">
      <div>
        <label>Combustible</label>
        <select id="combustible">{% for c in op.combustibles %}<option>{{c}}</option>{% endfor %}</select>
      </div>
      <div>
        <label>Transmisión</label>
        <select id="transmision">{% for t in op.transmisiones %}<option>{{t}}</option>{% endfor %}</select>
      </div>
    </div>
    <label>Precio publicado / ofrecido (opcional — para clasificar)</label>
    <input id="precio" type="number" placeholder="Ej: 8500000">
    <button onclick="estimar()">Estimar precio</button>
  </div>

  <div class="card" id="out">
    <div class="central" id="central"></div>
    <div class="barra"><div class="fill" id="fill"></div><div class="p50dot" id="dot"></div></div>
    <div class="ends"><span id="lo"></span><span id="hi"></span></div>
    <div class="rango"><span class="lbl">rango estimado de mercado</span></div>
    <div id="estado"></div>
  </div>
  <div class="foot">Herramienta de apoyo a la tasación. El valor final requiere inspección del vehículo.</div>
</div>

<script>
const MODELOS = {{ op.modelos_por_marca | tojson }};
const marcaSel = document.getElementById('marca');
const modeloSel = document.getElementById('modelo');
{{ op.marcas | tojson }}.forEach(m => marcaSel.add(new Option(m, m)));
function cargarModelos() {
  modeloSel.innerHTML = '';
  (MODELOS[marcaSel.value] || []).forEach(m => modeloSel.add(new Option(m, m)));
}
marcaSel.onchange = cargarModelos;
marcaSel.value = 'Toyota' in MODELOS ? 'Toyota' : marcaSel.options[0].value;
cargarModelos();

async function estimar() {
  const body = {
    marca: marcaSel.value, modelo: modeloSel.value,
    ano: document.getElementById('ano').value,
    kilometraje: document.getElementById('kilometraje').value,
    combustible: document.getElementById('combustible').value,
    transmision: document.getElementById('transmision').value,
    precio: document.getElementById('precio').value,
  };
  const r = await fetch('/estimar', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  document.getElementById('out').style.display = 'block';
  document.getElementById('central').innerHTML = d.p50_txt + '<small>valor central estimado</small>';
  document.getElementById('lo').textContent = d.lo_txt;
  document.getElementById('hi').textContent = d.hi_txt;
  const pct = Math.max(4, Math.min(96, (d.p50 - d.lo) / (d.hi - d.lo) * 100));
  document.getElementById('fill').style.left = '0%';
  document.getElementById('fill').style.width = '100%';
  document.getElementById('dot').style.left = pct + '%';
  const est = document.getElementById('estado');
  if (d.estado) {
    est.className = 'estado ' + d.clase;
    est.textContent = d.estado + ' · ' + d.precio_txt;
  } else { est.className = ''; est.textContent = ''; }
}
</script>
</body>
</html>
